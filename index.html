<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{

}</script></head><body>


<meta charset="UTF-8">
<title>Game Lobby Chat</title>

<style>
body{
    background:#0b1020;
    color:white;
    font-family:Arial;
    text-align:center;
}

#players{
    margin:10px auto;
}

.player{
    background:#1e2a55;
    padding:8px;
    margin:4px auto;
    width:220px;
    border-radius:8px;
}

#chat{
    width:80%;
    height:300px;
    margin:15px auto;
    background:#111933;
    overflow-y:auto;
    padding:10px;
    border-radius:10px;
    text-align:left;
}

.msg{
    margin:8px 0;
    padding:6px;
    background:#1c2b60;
    border-radius:6px;
}

img, video{
    max-width:250px;
    border-radius:6px;
    margin-top:6px;
}

#controls{
    margin-top:10px;
}

input{
    padding:8px;
    width:50%;
    border-radius:6px;
    border:none;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    background:#4c7dff;
    color:white;
    cursor:pointer;
}
</style>




<h1>🌐 Game Lobby</h1>

<div id="players"></div>

<div id="chat"></div>

<div id="controls">
    <input id="messageInput" placeholder="Type message or paste link...">
    <button onclick="sendMessage()">Send</button>
    <input type="file" id="fileInput">
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
const username = "Player-" + Math.floor(Math.random()*10000);

const playersDiv = document.getElementById("players");
const chatDiv = document.getElementById("chat");
const fileInput = document.getElementById("fileInput");

const peer = new Peer();
let connections = {};
let players = {};

function renderPlayers(){
    playersDiv.innerHTML="<h3>Players Online</h3>";
    Object.values(players).forEach(name=>{
        const div=document.createElement("div");
        div.className="player";
        div.textContent=name;
        playersDiv.appendChild(div);
    });
}

function addMessage(html){
    const div=document.createElement("div");
    div.className="msg";
    div.innerHTML=html;
    chatDiv.appendChild(div);
    chatDiv.scrollTop=chatDiv.scrollHeight;
}

function broadcast(data){
    Object.values(connections).forEach(c=>{
        if(c.open) c.send(data);
    });
}

peer.on("open", id=>{
    players[id]=username;
    renderPlayers();

    const ROOM="global-game-room";

    const host=new Peer(ROOM);

    host.on("connection", conn=>setupConnection(conn));

    const conn=peer.connect(ROOM);
    conn.on("open",()=>setupConnection(conn));
});

function setupConnection(conn){

    connections[conn.peer]=conn;

    conn.send({
        type:"join",
        name:username
    });

    conn.on("data", data=>{

        if(data.type==="join"){
            players[conn.peer]=data.name;

            conn.send({
                type:"sync",
                players
            });

            renderPlayers();
        }

        if(data.type==="sync"){
            players=data.players;
            players[peer.id]=username;
            renderPlayers();
        }

        if(data.type==="chat"){
            displayChat(data);
        }

        if(data.type==="file"){
            receiveFile(data);
        }
    });

    conn.on("close",()=>{
        delete players[conn.peer];
        renderPlayers();
    });
}

/* ---------- CHAT ---------- */

function sendMessage(){
    const input=document.getElementById("messageInput");
    const text=input.value.trim();
    if(!text) return;

    const msg={
        type:"chat",
        name:username,
        text:text
    };

    displayChat(msg);
    broadcast(msg);

    input.value="";
}

function displayChat(data){

    let content = `<b>${data.name}:</b> `;

    // auto-detect links
    if(data.text.startsWith("http")){
        content += `<a href="${data.text}" target="_blank">${data.text}</a>`;
    }else{
        content += data.text;
    }

    addMessage(content);
}

/* ---------- FILE SENDING ---------- */

fileInput.addEventListener("change", ()=>{
    const file=fileInput.files[0];
    if(!file) return;

    const reader=new FileReader();

    reader.onload=e=>{
        const msg={
            type:"file",
            name:username,
            filename:file.name,
            filetype:file.type,
            data:e.target.result
        };

        broadcast(msg);
        receiveFile(msg);
    };

    reader.readAsDataURL(file);
});

function receiveFile(data){

    let html=`<b>${data.name} sent:</b><br>`;

    if(data.filetype.startsWith("image")){
        html+=`<img src="${data.data}">`;
    }
    else if(data.filetype.startsWith("video")){
        html+=`<video controls src="${data.data}"></video>`;
    }
    else{
        html+=`
        <a download="${data.filename}" href="${data.data}">
        Download ${data.filename}
        </a>`;
    }

    addMessage(html);
}

/* ---------- ENTER KEY SEND ---------- */
document.getElementById("messageInput")
.addEventListener("keypress", e=>{
    if(e.key==="Enter") sendMessage();
});

</script>


<script src="./script.js"></script></body></html>
