<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


<meta charset="UTF-8">
<title>Universal Chat</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1020;
    color:white;
}

/* ---------- LAYOUT ---------- */

#board, #chatView{
    padding:20px;
}

.room{
    background:#1c2b60;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    cursor:pointer;
}

#chat{
    height:300px;
    overflow-y:auto;
    background:#111933;
    padding:10px;
    border-radius:10px;
}

.msg{margin:6px 0;padding:6px;background:#1e2a55;border-radius:6px;}

#users{
    position:absolute;
    right:0;
    top:0;
    width:200px;
    height:100%;
    background:#0f1735;
    padding:10px;
}

.avatar{
    width:28px;
    height:28px;
    border-radius:50%;
    vertical-align:middle;
    margin-right:6px;
}

.typing{
    font-size:12px;
    opacity:.7;
}
</style>




<div id="board">
<h2>🌐 Chatroom Board</h2>

<input id="roomName" placeholder="Room name">
<input id="roomPass" placeholder="Password (optional)">
<button onclick="createRoom()">Create Room</button>

<div id="rooms"></div>
</div>

<div id="chatView" style="display:none">

<button onclick="leaveRoom()">⬅ Back</button>

<h2 id="roomTitle"></h2>

<div id="chat"></div>

<div class="typing" id="typing"></div>

<input id="msg" placeholder="Message..." style="width:60%">
<button onclick="sendMsg()">Send</button>
<button onclick="startVoice()">🎤 Voice</button>

<input type="file" id="fileInput" hidden="">

<div id="users"></div>

</div>

<script>
/* ---------- CONNECTION ---------- */

const socket=new WebSocket("wss://ws.ifelse.io");

const username=prompt("Choose username:");
const avatar=`https://api.dicebear.com/8.x/thumbs/svg?seed=${username}`;

let currentRoom=null;
let rooms={};
let users={};

/* ---------- UI HELPERS ---------- */

function addChat(html){
    const d=document.createElement("div");
    d.className="msg";
    d.innerHTML=html;
    chat.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
}

function renderRooms(){
    roomsDiv.innerHTML="";
    Object.values(rooms).forEach(r=>{
        const div=document.createElement("div");
        div.className="room";
        div.textContent=r.name+(r.private?" 🔒":"");
        div.onclick=()=>joinRoom(r.id);
        roomsDiv.appendChild(div);
    });
}

function renderUsers(){
    usersDiv.innerHTML="<h4>Online</h4>";
    Object.values(users).forEach(u=>{
        usersDiv.innerHTML+=
        `<div><img class="avatar" src="${u.avatar}">${u.name}</div>`;
    });
}

/* ---------- SOCKET ---------- */

socket.onmessage=e=>{
    const data=JSON.parse(e.data);

    if(data.type==="rooms"){
        rooms=data.rooms;
        renderRooms();
    }

    if(data.type==="chat" && data.room===currentRoom){
        addChat(`<img class="avatar" src="${data.avatar}">
        <b>${data.name}</b>: ${data.text}`);
    }

    if(data.type==="users" && data.room===currentRoom){
        users=data.users;
        renderUsers();
    }

    if(data.type==="typing" && data.room===currentRoom){
        typing.textContent=data.name+" is typing...";
        setTimeout(()=>typing.textContent="",1200);
    }

    if(data.type==="file" && data.room===currentRoom){
        receiveFile(data);
    }
};

/* ---------- ROOMS ---------- */

function createRoom(){
    socket.send(JSON.stringify({
        type:"createRoom",
        name:roomName.value,
        password:roomPass.value
    }));
}

function joinRoom(id){
    const room=rooms[id];

    if(room.private){
        const pass=prompt("Enter password:");
        socket.send(JSON.stringify({
            type:"join",
            room:id,
            password:pass,
            name:username,
            avatar
        }));
    }else{
        socket.send(JSON.stringify({
            type:"join",
            room:id,
            name:username,
            avatar
        }));
    }

    currentRoom=id;
    board.style.display="none";
    chatView.style.display="block";
    roomTitle.textContent=room.name;
}

function leaveRoom(){
    location.reload();
}

/* ---------- CHAT ---------- */

msg.addEventListener("input",()=>{
    socket.send(JSON.stringify({
        type:"typing",
        room:currentRoom,
        name:username
    }));
});

function sendMsg(){
    socket.send(JSON.stringify({
        type:"chat",
        room:currentRoom,
        name:username,
        avatar,
        text:msg.value
    }));
    msg.value="";
}

/* ---------- DRAG DROP ---------- */

document.addEventListener("dragover",e=>e.preventDefault());

document.addEventListener("drop",e=>{
    e.preventDefault();
    const file=e.dataTransfer.files[0];
    sendFile(file);
});

fileInput.onchange=e=>sendFile(e.target.files[0]);

function sendFile(file){
    const reader=new FileReader();
    reader.onload=x=>{
        socket.send(JSON.stringify({
            type:"file",
            room:currentRoom,
            name:username,
            avatar,
            filename:file.name,
            filetype:file.type,
            data:x.target.result
        }));
    };
    reader.readAsDataURL(file);
}

function receiveFile(d){
    let html=`<img class="avatar" src="${d.avatar}">
    <b>${d.name}</b><br>`;

    if(d.filetype.startsWith("image"))
        html+=`<img src="${d.data}">`;
    else if(d.filetype.startsWith("video"))
        html+=`<video controls src="${d.data}" width="240"></video>`;
    else
        html+=`<a download="${d.filename}" href="${d.data}">
        Download ${d.filename}</a>`;

    addChat(html);
}

/* ---------- VOICE CHAT ---------- */

let audioStream;
async function startVoice(){
    audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
    addChat("🎤 Voice connected (browser mic active)");
}

</script>


<script src="./script.js"></script></body></html>
