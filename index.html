<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


<meta charset="UTF-8">
<title>Game Lobby</title>

<style>
body{
    background:#0b1020;
    color:white;
    font-family:Arial;
    text-align:center;
}

#chat{
    width:80%;
    height:320px;
    margin:20px auto;
    background:#111933;
    overflow-y:auto;
    padding:10px;
    border-radius:10px;
    text-align:left;
}

.msg{
    background:#1c2b60;
    margin:6px 0;
    padding:6px;
    border-radius:6px;
}

img,video{max-width:240px;border-radius:6px;margin-top:6px;}
</style>




<h1>🌐 Game Lobby Chat</h1>

<div id="chat"></div>

<input id="message" placeholder="Type message or paste link..." style="width:55%">
<button onclick="sendMessage()">Send</button>
<input type="file" id="fileInput">

<script>

// RANDOM NAME
const username="Player-"+Math.floor(Math.random()*9999);

// PUBLIC WEBSOCKET RELAY (no signup required)
const socket=new WebSocket("wss://ws.ifelse.io");

// unique room
const ROOM="game-grails-room";

const chat=document.getElementById("chat");

function add(html){
    const d=document.createElement("div");
    d.className="msg";
    d.innerHTML=html;
    chat.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
}

socket.onopen=()=>{
    socket.send(JSON.stringify({
        type:"join",
        room:ROOM,
        name:username
    }));
};

socket.onmessage=(event)=>{
    const data=JSON.parse(event.data);

    if(data.room!==ROOM) return;

    if(data.type==="chat"){
        displayChat(data);
    }

    if(data.type==="file"){
        receiveFile(data);
    }
};

/* ---------- CHAT ---------- */

function sendMessage(){
    const input=document.getElementById("message");
    const text=input.value.trim();
    if(!text) return;

    const msg={
        type:"chat",
        room:ROOM,
        name:username,
        text
    };

    socket.send(JSON.stringify(msg));
    displayChat(msg);

    input.value="";
}

function displayChat(d){
    let html=`<b>${d.name}:</b> `;

    if(d.text.startsWith("http"))
        html+=`<a href="${d.text}" target="_blank">${d.text}</a>`;
    else
        html+=d.text;

    add(html);
}

/* ---------- FILES ---------- */

document.getElementById("fileInput").addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file) return;

    const reader=new FileReader();

    reader.onload=x=>{
        const msg={
            type:"file",
            room:ROOM,
            name:username,
            filename:file.name,
            filetype:file.type,
            data:x.target.result
        };

        socket.send(JSON.stringify(msg));
        receiveFile(msg);
    };

    reader.readAsDataURL(file);
});

function receiveFile(d){

    let html=`<b>${d.name} sent:</b><br>`;

    if(d.filetype.startsWith("image"))
        html+=`<img src="${d.data}">`;
    else if(d.filetype.startsWith("video"))
        html+=`<video controls src="${d.data}"></video>`;
    else
        html+=`<a download="${d.filename}" href="${d.data}">Download ${d.filename}</a>`;

    add(html);
}

/* ENTER KEY SEND */
document.getElementById("message").addEventListener("keypress",e=>{
    if(e.key==="Enter") sendMessage();
});

</script>


<script src="./script.js"></script></body></html>
