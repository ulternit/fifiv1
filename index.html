<!DOCTYPE html>
<html lang="en" class=""><head><script>window.livecodes = window.livecodes || {};</script><title>Untitled Project</title><meta name="title" content="Untitled Project"><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js" async=""></script><script type="importmap">{
  "imports": {}
}</script></head><body>


<meta charset="UTF-8">
<title>Game Lobby Chat</title>

<style>
body{
    background:#0b1020;
    color:white;
    font-family:Arial;
    text-align:center;
}

#players{margin:10px;}
.player{
    background:#1e2a55;
    padding:8px;
    margin:4px auto;
    width:220px;
    border-radius:8px;
}

#chat{
    width:80%;
    height:300px;
    margin:15px auto;
    background:#111933;
    overflow-y:auto;
    padding:10px;
    border-radius:10px;
    text-align:left;
}

.msg{
    margin:6px 0;
    padding:6px;
    background:#1c2b60;
    border-radius:6px;
}

img,video{max-width:250px;border-radius:6px;margin-top:6px;}
</style>




<h1>🌐 Game Lobby</h1>

<div id="players"></div>
<div id="chat"></div>

<input id="msg" placeholder="Message..." style="width:50%">
<button onclick="sendMsg()">Send</button>
<input type="file" id="fileInput">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
const ROOM_ID = "global-game-room-fixed"; // ONE TRUE HOST

const username = "Player-" + Math.floor(Math.random()*10000);

const peer = new Peer();
let connections = {};
let players = {};
let seenMessages = new Set();

const playersDiv=document.getElementById("players");
const chat=document.getElementById("chat");

/* ---------- UI ---------- */

function renderPlayers(){
    playersDiv.innerHTML="<h3>Players</h3>";
    Object.values(players).forEach(p=>{
        const d=document.createElement("div");
        d.className="player";
        d.textContent=p;
        playersDiv.appendChild(d);
    });
}

function addChat(html){
    const d=document.createElement("div");
    d.className="msg";
    d.innerHTML=html;
    chat.appendChild(d);
    chat.scrollTop=chat.scrollHeight;
}

/* ---------- NETWORK ---------- */

peer.on("open", id=>{

    players[id]=username;
    renderPlayers();

    // try connect to host
    const conn=peer.connect(ROOM_ID);

    conn.on("open",()=>{
        setupConnection(conn);
    });

    // if host doesn't exist → become host
    peer.on("connection", incoming=>{
        setupConnection(incoming);
    });

});

/* ---------- CONNECTION ---------- */

function setupConnection(conn){

    if(connections[conn.peer]) return;
    connections[conn.peer]=conn;

    conn.send({
        type:"join",
        id:peer.id,
        name:username
    });

    conn.on("data", handleData);

    conn.on("close",()=>{
        delete players[conn.peer];
        renderPlayers();
    });
}

/* ---------- MESSAGE HANDLER ---------- */

function handleData(data){

    // prevent duplicates
    if(data.msgId){
        if(seenMessages.has(data.msgId)) return;
        seenMessages.add(data.msgId);
    }

    if(data.type==="join"){
        players[data.id]=data.name;
        renderPlayers();

        broadcast({
            type:"players",
            players
        });
    }

    if(data.type==="players"){
        players=data.players;
        players[peer.id]=username;
        renderPlayers();
    }

    if(data.type==="chat"){
        showChat(data);
        broadcast(data);
    }

    if(data.type==="file"){
        receiveFile(data);
        broadcast(data);
    }
}

/* ---------- BROADCAST ---------- */

function broadcast(data){
    Object.values(connections).forEach(c=>{
        if(c.open) c.send(data);
    });
}

/* ---------- CHAT ---------- */

function sendMsg(){
    const input=document.getElementById("msg");
    const text=input.value.trim();
    if(!text) return;

    const msg={
        type:"chat",
        msgId:crypto.randomUUID(),
        name:username,
        text
    };

    showChat(msg);
    broadcast(msg);

    input.value="";
}

function showChat(d){
    let html=`<b>${d.name}:</b> `;
    if(d.text.startsWith("http"))
        html+=`<a href="${d.text}" target="_blank">${d.text}</a>`;
    else
        html+=d.text;

    addChat(html);
}

/* ---------- FILES ---------- */

document.getElementById("fileInput").addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file) return;

    const reader=new FileReader();
    reader.onload=x=>{

        const data={
            type:"file",
            msgId:crypto.randomUUID(),
            name:username,
            filename:file.name,
            filetype:file.type,
            data:x.target.result
        };

        receiveFile(data);
        broadcast(data);
    };

    reader.readAsDataURL(file);
});

function receiveFile(d){

    let html=`<b>${d.name} sent:</b><br>`;

    if(d.filetype.startsWith("image"))
        html+=`<img src="${d.data}">`;
    else if(d.filetype.startsWith("video"))
        html+=`<video controls src="${d.data}"></video>`;
    else
        html+=`<a download="${d.filename}" href="${d.data}">Download ${d.filename}</a>`;

    addChat(html);
}

/* ENTER KEY */
document.getElementById("msg").addEventListener("keypress",e=>{
    if(e.key==="Enter") sendMsg();
});
</script>


<script src="./script.js"></script></body></html>
